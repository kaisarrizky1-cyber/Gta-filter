<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA V Style Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #080808; --surface: #101010; --border: #1c1c1c; --gold: #f0c040; --red: #d63b1f; --text: #e8e8e8; --muted: #444; }
html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; }
.page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 52px 20px 80px; }
header { text-align: center; margin-bottom: 48px; }
.eyebrow { font-size: 10px; letter-spacing: 0.3em; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; }
.logo { font-family: 'Bebas Neue', sans-serif; font-size: clamp(64px, 13vw, 110px); color: var(--gold); letter-spacing: 0.06em; line-height: 0.85; text-shadow: 0 0 60px rgba(240,192,64,0.2); }
.logo span { display: block; font-size: 0.4em; color: #555; letter-spacing: 0.25em; }
.tagline { margin-top: 14px; font-size: 12px; color: #333; letter-spacing: 0.08em; }
.box { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px; }
.input-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 4px; display: flex; gap: 8px; align-items: flex-end; }
textarea { background: transparent; border: none; outline: none; color: var(--text); font-family: 'Syne', sans-serif; font-size: 13px; padding: 14px; width: 100%; resize: none; min-height: 80px; line-height: 1.6; }
textarea::placeholder { color: #2a2a2a; }
.btn-generate { background: var(--gold); color: #080808; border: none; padding: 12px 20px; border-radius: 2px; font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; white-space: nowrap; transition: all 0.2s; flex-shrink: 0; margin: 4px; }
.btn-generate:hover { background: #ffd055; }
.btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }
.examples { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 10px; letter-spacing: 0.06em; color: var(--muted); cursor: pointer; transition: all 0.15s; background: transparent; font-family: inherit; text-transform: uppercase; }
.chip:hover { border-color: var(--gold); color: var(--gold); }
.result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; position: relative; display: none; }
.result-card.on { display: block; }
.result-label { position: absolute; top: 10px; left: 10px; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #333; background: rgba(8,8,8,0.85); padding: 4px 8px; border-radius: 2px; z-index: 2; }
.result-card img { display: block; width: 100%; }
.loading-box { width: 100%; min-height: 300px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; }
.loading-box.on { display: flex; }
.ring { width: 40px; height: 40px; border: 1.5px solid #1c1c1c; border-top-color: var(--gold); border-radius: 50%; animation: spin 0.9s linear infinite; }
.loading-msg { font-size: 11px; color: #555; letter-spacing: 0.1em; text-transform: uppercase; }
.prog-wrap { width: 120px; height: 1px; background: #1c1c1c; }
.prog-bar { height: 100%; background: var(--gold); transition: width 0.5s ease; width: 0%; }
.bottom { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 14px 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; display: none; }
.bottom.on { display: flex; }
.btn-dl { background: var(--red); color: #fff; border: none; padding: 9px 18px; border-radius: 2px; font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
.error-box { display: none; background: rgba(214,59,31,0.07); border: 1px solid rgba(214,59,31,0.2); border-radius: 2px; padding: 14px 18px; font-size: 12px; color: #e07060; line-height: 1.6; }
.error-box.on { display: block; }
footer { margin-top: 60px; font-size: 10px; color: #1a1a1a; letter-spacing: 0.15em; text-transform: uppercase; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">AI Image Generator</div>
    <div class="logo">GTA V<span>Style</span></div>
    <p class="tagline">Deskripsikan karakter → AI generate GTA V style</p>
  </header>

  <div class="box">
    <div class="input-wrap">
      <textarea id="promptInput" placeholder="Contoh: pria berjaket hitam berdiri di jalanan malam los santos..."></textarea>
      <button class="btn-generate" id="btnGenerate">Generate</button>
    </div>

    <div class="examples">
      <button class="chip" onclick="setPrompt('pria berjaket kulit hitam di jalanan malam')">Pria Jalanan</button>
      <button class="chip" onclick="setPrompt('wanita berambut panjang di pantai los santos')">Wanita Pantai</button>
      <button class="chip" onclick="setPrompt('pria bertato naik motor di highway')">Biker</button>
      <button class="chip" onclick="setPrompt('karakter gangster di depan lowrider merah')">Gangster</button>
    </div>

    <div class="loading-box" id="loadingBox">
      <div class="ring"></div>
      <div class="loading-msg" id="loadingMsg">Generating…</div>
      <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="result-card" id="resultCard">
      <div class="result-label">GTA V Style</div>
      <img id="imgResult" src="" alt="result">
    </div>

    <div class="bottom" id="bottomBar">
      <button class="btn-dl" id="btnDownload">↓ Download</button>
    </div>
  </div>

  <footer>Powered by Hugging Face AI</footer>
</div>

<script>
function setPrompt(text) {
  document.getElementById('promptInput').value = text;
}

let currentImage = null;

document.getElementById('btnGenerate').addEventListener('click', generate);
document.getElementById('promptInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); }
});

async function generate() {
  const prompt = document.getElementById('promptInput').value.trim();
  if (!prompt) return;

  const btn = document.getElementById('btnGenerate');
  const loadingBox = document.getElementById('loadingBox');
  const loadingMsg = document.getElementById('loadingMsg');
  const progBar = document.getElementById('progBar');
  const resultCard = document.getElementById('resultCard');
  const errorBox = document.getElementById('errorBox');
  const bottomBar = document.getElementById('bottomBar');

  btn.disabled = true;
  loadingBox.classList.add('on');
  resultCard.classList.remove('on');
  errorBox.classList.remove('on');
  bottomBar.classList.remove('on');
  progBar.style.width = '10%';
  loadingMsg.textContent = 'Mengirim ke AI…';

  let prog = 10;
  const timer = setInterval(() => {
    if (prog < 85) { prog += 2; progBar.style.width = prog + '%'; }
    if (prog > 30) loadingMsg.textContent = 'AI sedang menggambar…';
    if (prog > 60) loadingMsg.textContent = 'Hampir selesai…';
  }, 800);

  try {
    const res = await fetch('/api/transform', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    const data = await res.json();
    clearInterval(timer);

    if (!res.ok || data.error) throw new Error(data.error || 'Gagal generate');

    progBar.style.width = '100%';
    currentImage = data.image;
    document.getElementById('imgResult').src = data.image;
    loadingBox.classList.remove('on');
    resultCard.classList.add('on');
    bottomBar.classList.add('on');

    document.getElementById('btnDownload').onclick = () => {
      const a = document.createElement('a');
      a.href = currentImage;
      a.download = 'gta-v-style.png';
      a.click();
    };

  } catch(err) {
    clearInterval(timer);
    loadingBox.classList.remove('on');
    errorBox.classList.add('on');
    errorBox.textContent = '⚠ ' + err.message;
  }

  btn.disabled = false;
}
</script>
</body>
</html>
