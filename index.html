<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Generator</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
padding:30px 15px;
}

.container{
width:100%;
max-width:800px;
}

h1{
font-size:32px;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
opacity:.7;
margin-bottom:30px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
}

textarea{
width:100%;
height:120px;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
resize:none;
outline:none;
background:#334155;
color:white;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

button:hover{
opacity:.9;
}

.examples{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;
}

.example{
padding:10px;
background:#334155;
border-radius:10px;
font-size:13px;
cursor:pointer;
}

.loading{
display:none;
text-align:center;
margin-top:20px;
}

.result{
margin-top:25px;
display:none;
}

.result img{
width:100%;
border-radius:15px;
}

.download{
display:block;
margin-top:10px;
text-align:center;
padding:12px;
background:#16a34a;
border-radius:12px;
text-decoration:none;
color:white;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>AI Image Generator</h1>

<p class="subtitle">
Generate realistic photos with FLUX AI
</p>

<div class="card">

<textarea
id="prompt"
placeholder="Describe your image...">
</textarea>

<button onclick="generateImage()">
Generate Image
</button>

<div class="examples">

<div class="example" onclick="setPrompt(this)">
Aurel & Rizky giant Hollywood letters on a beautiful mountain at sunset
</div>

<div class="example" onclick="setPrompt(this)">
Pink biker standing beside a motorcycle on a neon city street
</div>

<div class="example" onclick="setPrompt(this)">
Luxury beach resort with palm trees and crystal clear water
</div>

</div>

<div class="loading" id="loading">
Generating image...
</div>

<div class="result" id="result">
<img id="generatedImage">
<a id="downloadBtn"
class="download"
download="ai-image.png">
Download Image
</a>
</div>

</div>

</div>

<script>

function setPrompt(el){
document.getElementById('prompt').value =
el.innerText;
}

async function generateImage(){

const prompt =
document.getElementById('prompt').value.trim();

if(!prompt){
alert('Enter a prompt');
return;
}

const loading =
document.getElementById('loading');

const result =
document.getElementById('result');

loading.style.display='block';
result.style.display='none';

try{

const response = await fetch('/api/transform',{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
prompt
})
});

const data = await response.json();

if(data.error){
throw new Error(data.error);
}

document.getElementById('generatedImage').src =
data.image;

document.getElementById('downloadBtn').href =
data.image;

result.style.display='block';

}catch(error){

alert(error.message);

}finally{

loading.style.display='none';

}

}
</script>

</body>
</html>
